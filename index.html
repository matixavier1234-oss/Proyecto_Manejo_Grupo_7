    <link

<script src="js/app.js"></script>

            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    MotoStore
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar navegación">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#catalogo">
                                Motos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#servicios">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#nosotros">
                                Nosotros
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#contacto">
                                Contacto
                            </a>
                        </li>

                    </ul>

                    <a href="#catalogo" class="btn btn-danger ms-lg-3">
                        Ver motos
                    </a>

                </div>

            </div>
        </nav>
    </header>


    <main>

    <section id="hero" class="hero-principal">
        <div class="hero-overlay">
            <div class="container">
                <div class="hero-contenido">

                    <h6>Encuentra tu moto ideal</h6>

                    <h1>
                        Vive la experiencia de conducir la motocicleta perfecta
                    </h1>

                    <p>
                        Explora nuestro catalogo y conoce diferentes modelos
                        disponibles para ti.
                    </p>

                    <a href="#catalogo" class="btn btn-danger">
                        Ver motos
                    </a>

                </div>
            </div>

    <!-- Los modulos del proyecto se integraran aqui -->

    </main>


    <script
