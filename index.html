<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotoStore | Motocicletas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet" href="css/styles.css">
</head>

<script src="js/app.js"></script>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    MotoStore
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar navegación">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#catalogo">
                                Motos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#servicios">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#nosotros">
                                Nosotros
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#contacto">
                                Contacto
                            </a>
                        </li>

                    </ul>

                    <a href="#catalogo" class="btn btn-danger ms-lg-3">
                        Ver motos
                    </a>

                </div>

            </div>
        </nav>
    </header>


    <main>

        <section id="hero" class="hero-principal">
            <div class="hero-overlay">
                <div class="container">
                    <div class="hero-contenido">

                        <h6>Encuentra tu moto ideal</h6>

                        <h1>
                            Vive la experiencia de conducir la motocicleta perfecta
                        </h1>

                        <p>
                            Explora nuestro catalogo y conoce diferentes modelos
                            disponibles para ti.
                        </p>

                        <a href="#catalogo" class="btn btn-danger" aria-label="Ver catalogo de motocicletas">
                            Ver motos
                        </a>

                    </div>
                </div>
            </div>
        </section>

        <!-- AQUÍ REEMPLAZAMOS EL COMENTARIO DE ÁNGEL POR TU CATÁLOGO -->
        <section id="catalogo" class="py-5">
            <div class="container">
                <h2 class="mb-4">Nuestro catálogo</h2>
                <div class="mb-4">
                    <label for="filtro-tipo" class="form-label">Filtrar por tipo:</label>
                    <select id="filtro-tipo" class="form-select" style="max-width: 250px;">
                        <option value="todas">Todas</option>
                        <option value="deportiva">Deportiva</option>
                        <option value="urbana">Urbana</option>
                        <option value="trabajo">Trabajo</option>
                    </select>
                </div>
                <div id="catalogo-container" class="row"></div>
            </div>
        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
    
    <!-- AQUÍ SE AGREGA TU SCRIPT COMO INDICABA EL PASO 3 -->
    <script src="js/catalogo.js"></script>

</body>

</html>
