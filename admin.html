<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel administrativo | MotoStore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="admin-page">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">MotoStore</a>
                <a class="btn btn-outline-light" href="index.html">Volver a la tienda</a>
            </div>
        </nav>
    </header>

    <main class="container py-4 py-lg-5">
        <div class="admin-heading d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
            <div>
                <p class="text-uppercase text-danger fw-semibold mb-2">Administración</p>
                <h1 class="h2 mb-2">Gestión de inventario</h1>
                <p class="text-secondary mb-0">Consulta y actualiza las motocicletas disponibles en la tienda.</p>
            </div>
            <button class="btn btn-danger align-self-lg-end" id="btn-nueva-moto" type="button">
                Agregar motocicleta
            </button>
        </div>

        <section class="admin-panel" aria-labelledby="inventario-titulo">
            <div class="admin-panel__header d-flex flex-column flex-lg-row justify-content-between gap-3">
                <div>
                    <h2 class="h5 mb-1" id="inventario-titulo">Inventario</h2>
                    <p class="text-secondary small mb-0"><span id="contador-motos">0</span> motocicletas registradas</p>
                </div>
                <div class="admin-filters row g-2">
                    <div class="col-sm-auto">
                        <label class="visually-hidden" for="buscar-moto">Buscar motocicleta</label>
                        <input class="form-control" id="buscar-moto" type="search" placeholder="Buscar por marca o modelo">
                    </div>
                    <div class="col-sm-auto">
                        <label class="visually-hidden" for="filtro-tipo-admin">Filtrar por tipo</label>
                        <select class="form-select" id="filtro-tipo-admin">
                            <option value="todas">Todos los tipos</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table admin-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Motocicleta</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario">
                        <tr>
                            <td class="text-center text-secondary py-4" colspan="7">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modal-moto" tabindex="-1" aria-labelledby="modal-moto-titulo" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="modal-moto-titulo">Agregar motocicleta</h2>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="formulario-moto">
                    <div class="modal-body">
                        <input id="moto-id" type="hidden">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="moto-marca">Marca</label>
                                <input class="form-control" id="moto-marca" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="moto-modelo">Modelo</label>
                                <input class="form-control" id="moto-modelo" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="moto-tipo">Tipo</label>
                                <select class="form-select" id="moto-tipo" required>
                                    <option value="urbana">Urbana</option>
                                    <option value="deportiva">Deportiva</option>
                                    <option value="trabajo">Trabajo</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="moto-precio">Precio</label>
                                <input class="form-control" id="moto-precio" type="number" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="moto-stock">Stock</label>
                                <input class="form-control" id="moto-stock" type="number" min="0" step="1" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="moto-imagen">URL de imagen</label>
                                <input class="form-control" id="moto-imagen" type="url" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="moto-descripcion">Descripción</label>
                                <textarea class="form-control" id="moto-descripcion" rows="3" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-danger" type="submit">Guardar motocicleta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
